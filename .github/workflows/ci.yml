name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancela jobs duplicados no mesmo branch (último push vence)
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─── Web (Next.js) — type-check + lint + build ─────────────────────────────
  web:
    name: Web (type-check + lint + build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.29.3

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install (frozen)
        run: pnpm install --frozen-lockfile
        env:
          NEXT_TELEMETRY_DISABLED: "1"

      - name: Type-check
        run: pnpm --filter @girob2b/web exec tsc --noEmit

      - name: Lint
        run: pnpm --filter @girob2b/web lint

      - name: Build (Next.js)
        run: pnpm --filter @girob2b/web build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          # Envs do Supabase nos secrets do repo. O build prefetcha rotas (ex:
          # /categoria/[slug] via generateStaticParams) usando createAdminClient,
          # então o SERVICE_ROLE_KEY é OBRIGATÓRIO no build — não só os NEXT_PUBLIC.
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NEXT_PUBLIC_APP_URL: https://app.girob2b.com.br
          NEXT_PUBLIC_APP_NAME: GiroB2B
          AUTH_REDIRECT_BASE_URL: https://app.girob2b.com.br

  # ─── Admin (Next.js — apps/admin) — type-check + lint ──────────────────────
  admin:
    name: Admin (type-check + lint)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.29.3

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install (frozen)
        run: pnpm install --frozen-lockfile

      - name: Type-check
        run: pnpm --filter @girob2b/admin exec tsc --noEmit

      - name: Lint
        run: pnpm --filter @girob2b/admin lint

  # ─── Design System (mini-site local) — só type-check, sem build ────────────
  # Local-only (docs/release-process.md §2.1) — não tem build de produção.
  design-system:
    name: Design System (type-check)
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.29.3

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install (frozen)
        run: pnpm install --frozen-lockfile

      - name: Type-check
        run: pnpm --filter @girob2b/design-system exec tsc -b

  # ─── E2E (Playwright) — fluxos críticos ────────────────────────────────────
  # Suite seed-independente. O playwright.config.ts sobe o app via webServer
  # (next dev) antes de rodar os specs — não é necessário step de servidor manual.
  # Promover a obrigatório em branch protection quando suite estabilizar
  # (docs/release-process.md §5.2).
  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.29.3

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install (frozen)
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm --filter @girob2b/web exec playwright install --with-deps chromium

      - name: Run E2E
        # playwright.config.ts sobe o Next.js via webServer (next dev) e herda
        # todos os env vars abaixo. reuseExistingServer=false em CI (fresh start).
        # Todos os specs são seed-independentes; specs autenticados aguardam
        # globalSetup com conta seedada (docs/release-process.md §5.2).
        run: pnpm --filter @girob2b/web exec playwright test
        env:
          # Supabase — obrigatórios para o app subir e servir páginas SSR/RSC
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          # SERVICE_ROLE_KEY: usado pelo createAdminClient em RSCs de build-time
          # (ex: /categoria/[slug], /buscar) — sem ele o app falha ao servir essas rotas
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # App — URLs e nome usados em metadata, redirects e callbacks de auth
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          NEXT_PUBLIC_APP_NAME: GiroB2B
          AUTH_REDIRECT_BASE_URL: http://localhost:3000
          NEXT_TELEMETRY_DISABLED: "1"

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7

# ─── Branch protection (configurar manualmente no GitHub) ───────────────────
# Documentado em docs/release-process.md §5.3.
#
# Settings → Branches → Add rule for `main`:
#   - Require pull request before merging (approvals = 0 enquanto solo dev)
#   - Require status checks to pass before merging:
#     - "Web (type-check + lint + build)"
#     - "Admin (type-check + lint)"
#     - "Design System (type-check)"
#     - "E2E (Playwright)"           [promover a obrigatório quando suite estabilizar]
#   - Require branches to be up to date before merging
#   - Require conversation resolution before merging
#   - Do not allow force pushes
#   - Restrict who can push to matching branches (bloqueia push direto em main)
